name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token for every job. Nothing here publishes, comments, or writes
# to the repository; jobs that need more must ask for it explicitly.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to full commit SHAs (tag in the
      # trailing comment) so a moved or compromised tag cannot change what
      # runs here. Bump them deliberately, re-resolving each SHA.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Must run before setup-node: `cache: pnpm` invokes `pnpm store path`.
      # Version is taken from the `packageManager` field in package.json.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          run_install: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run test
      - run: pnpm run build
      # The published package has no runtime dependencies today; this fails
      # the build if one with a known high or critical advisory is added.
      - run: pnpm audit --prod --audit-level high
